
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #2193b0, #6dd5ed);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #2193b0;
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            width: 70%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        button {
            padding: 12px 15px;
            border: none;
            background: #2193b0;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #176b82;
        }

        .weather-icon {
            width: 100px;
            height: 100px;
            margin: 10px auto;
        }

        .temperature {
            font-size: 45px;
            font-weight: bold;
            color: #333;
        }

        .city {
            font-size: 25px;
            margin: 10px 0;
            color: #444;
        }

        .description {
            color: #777;
            font-size: 18px;
            text-transform: capitalize;
            margin-bottom: 20px;
        }

        .details {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        .details div {
            text-align: center;
        }

        .details p {
            color: #777;
            font-size: 14px;
            margin-top: 8px;
        }

        .error {
            color: red;
            margin-top: 10px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Weather App</h1>

        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >
            <button onclick="getWeather()">Search</button>
        </div>

        <p id="error" class="error"></p>

        <div id="weatherInfo" class="hidden">

            <h2 class="city" id="city">City</h2>

            <img
                id="weatherIcon"
                class="weather-icon"
                src=""
                alt="Weather icon"
            >

            <div class="temperature" id="temperature">
                0°C
            </div>

            <p class="description" id="description">
                Weather condition
            </p>

            <div class="details">

                <div>
                    <h3 id="humidity">0%</h3>
                    <p>Humidity</p>
                </div>

                <div>
                    <h3 id="wind">0 km/h</h3>
                    <p>Wind Speed</p>
                </div>

            </div>

        </div>

    </div>

    <script>
        // Enter your OpenWeatherMap API key here
        const apiKey = "YOUR_API_KEY";

        async function getWeather() {

            const city = document
                .getElementById("cityInput")
                .value.trim();

            const error = document.getElementById("error");
            const weatherInfo =
                document.getElementById("weatherInfo");

            error.innerText = "";
            weatherInfo.classList.add("hidden");

            if (city === "") {
                error.innerText = "Please enter a city name!";
                return;
            }

            if (apiKey === "YOUR_API_KEY") {
                error.innerText = "Please add your API key in the code.";
                return;
            }

            const url =
                `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${apiKey}&units=metric`;

            try {

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("City not found!");
                }

                const data = await response.json();

                document.getElementById("city").innerText =
                    data.name + ", " + data.sys.country;

                document.getElementById("temperature").innerText =
                    Math.round(data.main.temp) + "°C";

                document.getElementById("description").innerText =
                    data.weather[0].description;

                document.getElementById("humidity").innerText =
                    data.main.humidity + "%";

                document.getElementById("wind").innerText =
                    data.wind.speed + " m/s";

                document.getElementById("weatherIcon").src =
                    `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;

                weatherInfo.classList.remove("hidden");

            } catch (err) {

                error.innerText =
                    err.message === "City not found!"
                    ? "City not found. Please try again!"
                    : "Unable to fetch weather data. Check your connection or API key.";

            }
        }

        // Search weather when Enter key is pressed
        document.getElementById("cityInput")
            .addEventListener("keypress", function(event) {

                if (event.key === "Enter") {
                    getWeather();
                }

            });

    </script>

</body>
</html>
